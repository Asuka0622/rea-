<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>结业报告 · 示例预览</title><link rel="stylesheet" href="/graduation-report.css"><style>body{margin:0;padding:24px 16px;background:#282c28;color:#f2e5c5;font:14px/1.7 "Microsoft YaHei",sans-serif}main{max-width:740px;margin:auto}h1{font-size:20px;margin:0 0 8px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}nav button,#try-photo{font:inherit;padding:8px 13px;background:#394b40;border:1px solid #7a957e;color:#f5eddc;min-height:44px;cursor:pointer}nav button[aria-pressed=true]{background:#e2cd9e;color:#302d28}nav button:focus-visible,#try-photo:focus-visible{outline:3px solid #d6aa57;outline-offset:3px}#report{box-shadow:0 14px 40px #0004}header>p{max-width:60ch;color:#c3c9be}.graduation-save{padding:8px 16px}</style></head>
<body><main><header><h1>同样结业，各有各的办案习惯</h1><p>以下四份都是虚构试玩记录，用来核对报告的差异。此页不读取、不修改你的游戏存档。</p></header><button id="try-photo" type="button">试拍路米证件照</button><div id="photo-booth" hidden></div><nav aria-label="选择示例档案"></nav><div id="report" aria-live="polite"></div></main>
<script type="module">
import {mountPhotoBooth} from '/detective-id.js';
import {buildGraduationReport,renderGraduationReport} from '/graduation-report.js';
function h(tag,attrs={},...children){const el=document.createElement(tag);for(const[key,value]of Object.entries(attrs)){if(value==null||value===false)continue;if(key.startsWith('on'))el.addEventListener(key.slice(2),value);else if(key==='class')el.className=value;else el.setAttribute(key,value);}for(const child of children.flat(Infinity)){if(child!=null&&child!==false)el.append(child instanceof Node?child:document.createTextNode(String(child)));}return el;}
const names=['小林','朵朵','小雨'];
const records=names.map((title,i)=>({id:String(i),title,clues:5,clueTotal:5,extras:1,extraTotal:1,evidence:6,words:9,hints:0,mistakes:0,retries:0,spent:8,stars:3,verified:true}));
const examples=[{label:'细看现场',records,gameRecord:{recorded:true,playSeconds:2846,worlds:['bit-town','london-1843'],regions:['中心广场','住宅区','手艺街','北区','南岸'],completedCases:6,totalCases:6,stars:16,starMax:18,achievementTotal:66,achievements:[{id:'first-day',title:'初来乍到'},{id:'case-three-stars',title:'完美结案'},{id:'riverside',title:'河对岸的风景'}],badges:[{id:'rea-detective',title:'见习侦探'}],skills:['数据流向','编码与加密','证据与声明']},habits:{longestIdleSeconds:82,idleBouts:2,moveSeconds:50,nightMoveSeconds:36,regions:['center','homes','craft','north']},talked:['a','b','c'],eggs:['cat']},{label:'直追代码',habits:{moveSeconds:60,sprintSeconds:48},records:records.map(item=>({...item,clues:1,extras:0}))},{label:'求助再出发',records:records.map(item=>({...item,clues:3,extras:0,hints:3,mistakes:2,retries:1}))},{label:'旧存档留白',records:[]}];
const nav=document.querySelector('nav'),host=document.querySelector('#report');
let currentExample=0; let samplePhoto={version:1,face:"normal",takenAt:"2026-10-19T00:00:00.000Z"};
function show(i){currentExample=i;host.replaceChildren(renderGraduationReport(h,buildGraduationReport({...examples[i],photo:i===3?null:samplePhoto,now:'2026-10-19T00:00:00.000Z',sample:true})));nav.querySelectorAll('button').forEach((button,j)=>button.setAttribute('aria-pressed',String(i===j)));}
document.querySelector('#try-photo').onclick=()=>{const booth=document.querySelector('#photo-booth');booth.hidden=false;booth.replaceChildren(mountPhotoBooth({h,initial:samplePhoto,onConfirm:photo=>{samplePhoto=photo;booth.hidden=true;show(currentExample);},onCancel:()=>{booth.hidden=true;}}));booth.querySelector('button')?.focus();};
examples.forEach((example,i)=>nav.append(h('button',{type:'button',onclick:()=>show(i),'aria-pressed':String(i===0)},example.label)));show(0);
</script></body></html>
