<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比特镇 · 素材验收</title><link rel="stylesheet" href="/art-review/review.css"></head>
<body><header><h1>素材验收</h1><p id="summary">正在读取本批素材…</p><p>技术检查与画面验收分开记录。原图和候选保持原状，不会因在这里预览而自动接入游戏。</p></header>
<form id="filters"><label>搜索文件、角色或问题<input id="search" type="search" placeholder="例如 lumi、空白、房间"></label><label>类型<select id="group"><option value="">所有类型</option></select></label><label>范围<select id="scope"><option value="">所有范围</option></select></label><label>状态<select id="state"><option value="">所有状态</option></select></label><label class="check"><input id="dedup" type="checkbox" checked>相同图片只显示一次</label><button id="export" type="button">导出我的验收记录</button></form>
<main><p id="count" role="status"></p><div id="grid"></div><nav id="pages" aria-label="分页"></nav></main>
<dialog id="detail"><div class="dialog-head"><h2 id="title"></h2><button id="close" type="button">关闭</button></div><div class="detail-grid"><div><div class="preview"><img id="full" alt=""></div><section id="animation" hidden><h3>动作预览</h3><div class="animation-stage"><canvas width="160" height="240" aria-label="精灵动作播放"></canvas></div><label>动作<select id="clip"></select></label><button id="flip" type="button">向左播放</button><button id="pause" type="button">暂停</button><p>动作按帧布局裁切；是否踩地、摆臂和循环自然，需观察整个周期。</p></section></div><div><dl id="facts"></dl><h3>技术检查</h3><ul id="issues"></ul><h3>人工验收</h3><label>结论<select id="decision"><option value="">尚未确认</option><option value="通过">通过</option><option value="返工">返工</option><option value="保留候选">保留候选</option></select></label><label>理由<textarea id="notes" rows="5" placeholder="记录画风、比例、动作、透视或锚点问题"></textarea></label><p>你的记录保存在本浏览器；导出后可交给制作方。这里不把机检合格当作美术完成。</p><h3>审核备注</h3><p id="manual"></p></div></div></dialog>
<script type="module" src="/art-review/review.js"></script></body></html>
