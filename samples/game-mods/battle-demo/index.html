<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REA 像素战斗 Demo</title><style>body{margin:0;background:#111722;color:#e6ddc3;font:16px/1.7 system-ui;text-align:center;padding:22px;box-sizing:border-box}h1{font-size:24px;color:#d6aa57}main{max-width:620px;margin:auto}.arena{display:flex;justify-content:space-around;gap:20px;margin:24px 0}.fighter{font-weight:bold}.sprite{width:48px;height:56px;background:#d6aa57;margin:16px auto;box-shadow:inset 0 -20px #263e37;border:4px solid #e6ddc3}.enemy{background:#a95745;box-shadow:inset 0 -20px #4b302c}progress{width:100%;max-width:210px;accent-color:#d6aa57}button{border:2px solid #d6aa57;background:#263e37;color:#e6ddc3;padding:10px 18px;font:inherit;cursor:pointer;margin:5px}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #e6ddc3}#log{min-height:54px}small{display:block}</style><main><h1>像素战斗 Demo</h1><p>每次攻击后，存活的敌人会反击。</p><div class="arena"><div class="fighter"><div class="sprite"></div>探索者<p id="player"></p><progress id="player-bar"></progress></div><div class="fighter"><div class="sprite enemy"></div>训练守卫<p id="enemy"></p><progress id="enemy-bar"></progress></div></div><p id="log" role="status" aria-live="polite"></p><button id="attack">攻击</button><button id="restart">重新开始</button><small>原创教学 Demo · 数值来源于本次导出的 balance.json</small></main><script>const balance={"playerHp":40,"playerAttack":8,"enemyHp":30,"enemyAttack":5};let player,enemy;const el=id=>document.getElementById(id);function draw(){el('player').textContent=player+' / '+balance.playerHp+' HP';el('enemy').textContent=enemy+' / '+balance.enemyHp+' HP';el('player-bar').max=balance.playerHp;el('player-bar').value=player;el('enemy-bar').max=balance.enemyHp;el('enemy-bar').value=enemy;el('attack').disabled=player<=0||enemy<=0;}function reset(){player=balance.playerHp;enemy=balance.enemyHp;el('log').textContent='轮到你了。';draw();}el('attack').onclick=()=>{if(player<=0||enemy<=0)return;enemy=Math.max(0,enemy-balance.playerAttack);if(enemy>0)player=Math.max(0,player-balance.enemyAttack);el('log').textContent=enemy===0?'胜利！训练守卫倒下了。':player===0?'探索者倒下了，调整数值后再试。':'你造成 '+balance.playerAttack+' 点伤害；敌人反击 '+balance.enemyAttack+' 点。';draw();};el('restart').onclick=reset;reset();</script></html>
